<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>考察手帳（試玩原型）</title>
<link rel="stylesheet" href="fonts/yozai/yozai.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #c3c6dc;
    font-family: "Yozai", "Hiragino Maru Gothic ProN", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: #2b2b2b;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; }
  /* 台詞與內文：Maple Mono CN Thin（tools/subset_font.py）；標籤、標題與原主日記：悠哉 Yozai Medium（tools/yozai_slices.py） */
  @font-face {
    font-family: "Maple Thin";
    src: url("fonts/maple-mono-cn-thin.woff2") format("woff2"), url("fonts/maple-mono-cn-thin.woff") format("woff");
    font-display: swap;
  }
  #text, .chip, .note p, .page p, .entry p, .slot.filled { font-family: "Maple Thin", "Noto Serif TC", "PingFang TC", sans-serif; letter-spacing: -.17em; }
  .chip { padding-right: .67em; }
  .slot.filled { padding-right: .57em; }
  .entry.diary p { font-family: "Yozai", "Hiragino Maru Gothic ProN", "PingFang TC", sans-serif; letter-spacing: 0; }

  /* ---------- 舞台 ---------- */
  #stage {
    position: absolute; left: 50%; top: 50%;
    -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
    overflow: hidden;
    background-color: #fbf8f1;
    background-image:
      linear-gradient(rgba(143,168,224,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,168,224,.16) 1px, transparent 1px);
    background-size: 1.2em 1.2em;
    box-shadow: 0 .4em 1.6em rgba(60,60,100,.25);
  }

  /* 紙膠帶 */
  .tape { position: absolute; height: 1.1em; opacity: .9; }
  .tape.pink {
    background-color: rgba(242,181,196,.85);
    background-image:
      linear-gradient(rgba(255,255,255,.45) 50%, transparent 50%),
      linear-gradient(90deg, rgba(255,255,255,.45) 50%, transparent 50%);
    background-size: .5em .5em;
  }
  .tape.blue { background-image: repeating-linear-gradient(45deg, #6aa6e8 0, #6aa6e8 .3em, #fff .3em, #fff .6em); opacity: .8; }
  .tape.lav { background: rgba(201,195,230,.8); }

  /* ---------- 上方列 ---------- */
  #topbar { position: absolute; left: .8em; right: .8em; top: .9em; height: 4.4em; z-index: 1; }
  #evidence {
    position: absolute; left: 0; top: 0;
    background: #fff; padding: 1.3em .7em .6em .7em;
    border: 1px solid #ddd8cc;
    box-shadow: .15em .2em 0 rgba(0,0,0,.06);
    -webkit-transform: rotate(-1.5deg); transform: rotate(-1.5deg);
  }
  #evidence .label { position: absolute; left: .5em; top: -.7em; font-size: 1em; font-weight: 700; padding: .05em .7em; background: rgba(242,181,196,.95); color: #6b3a48; letter-spacing: .15em; }
  .slots { white-space: nowrap; }
  .slot {
    display: inline-block; vertical-align: middle;
    min-width: 3.2em; height: 2em; line-height: 2em; margin-right: .35em;
    padding: 0 .4em; text-align: center; font-size: .9em;
    border: 2px dashed #8fa8e0; border-radius: .3em; color: #8fa8e0;
  }
  .slot.filled { border: none; background: #f6efc9; color: #2b2b2b; box-shadow: .1em .15em 0 rgba(0,0,0,.12); -webkit-transform: rotate(2deg); transform: rotate(2deg); }
  .slot.filled:nth-child(2) { -webkit-transform: rotate(-2deg); transform: rotate(-2deg); background: #fbe1e8; }
  .slot.filled:nth-child(3) { background: #dfe7fa; }
  #submitBtn { display: inline-block; vertical-align: middle; margin-left: .1em; font-size: .85em; padding: .45em .7em; border: none; border-radius: .4em; background: #2f55a4; color: #fff; }
  #submitBtn[disabled] { background: #b9c3dc; }
  #menuBtn {
    position: absolute; right: 0; top: .2em; width: 2.8em; height: 2.8em;
    background: #fff; border: 1px solid #ddd8cc; border-radius: .5em;
    box-shadow: .15em .2em 0 rgba(0,0,0,.06); padding: .45em;
  }
  #menuBtn svg { width: 100%; height: 100%; display: block; }

  /* ---------- 場景 ---------- */
  #scene { position: absolute; left: 0; right: 0; top: 5.2em; bottom: 12.4em; }
  .polaroid {
    position: absolute; left: 50%; top: 50%;
    width: 14.5em; padding: .7em .7em 2.6em .7em; background: #fff;
    box-shadow: .2em .3em .8em rgba(0,0,0,.15);
    -webkit-transform: translate(-50%, -50%) rotate(2deg); transform: translate(-50%, -50%) rotate(2deg);
    -webkit-transition: opacity .15s; transition: opacity .15s;
  }
  .polaroid .photo { height: 18em; background: #dfe7fa; position: relative; overflow: hidden; }
  .polaroid .photo svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 85%; }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: .55em; text-align: center; font-size: 1em; color: #555; }
  .polaroid .cap .d { color: #f2a0b4; margin-right: .4em; }
  .polaroid .tape { top: -.5em; left: 5em; width: 4.5em; -webkit-transform: rotate(-4deg); transform: rotate(-4deg); }
  .polaroid.hide { opacity: 0; }
  .placeholder-note { position: absolute; left: 0; right: 0; top: .6em; text-align: center; font-size: .7em; color: #6c7fb0; }
  .doodle { position: absolute; }
  #place { position: absolute; left: 1em; top: .6em; font-size: .9em; color: #555; padding: .2em .7em; background: rgba(255,255,255,.8); }
  #place .d { color: #f2a0b4; margin-right: .4em; }

  /* ---------- 對話框 ---------- */
  #dialog {
    position: absolute; left: .7em; right: .7em; bottom: 2.4em; height: 9em;
    background-color: #fff;
    background-image: linear-gradient(transparent 1.55em, rgba(143,168,224,.35) 1.55em, rgba(143,168,224,.35) 1.62em, transparent 1.62em);
    background-size: 100% 1.6em; background-position: 0 .3em;
    border: 1px solid #ddd8cc;
    box-shadow: .2em .3em 0 rgba(0,0,0,.06);
    -webkit-transform: rotate(-.6deg); transform: rotate(-.6deg);
  }
  #dialog .tape.l { left: -.6em; top: -.5em; width: 3.6em; -webkit-transform: rotate(-30deg); transform: rotate(-30deg); }
  #dialog .tape.r { right: -.6em; top: -.5em; width: 3.6em; -webkit-transform: rotate(30deg); transform: rotate(30deg); }
  #namebar { position: absolute; left: 1em; right: 1em; top: -.9em; white-space: nowrap; }
  #name { display: inline-block; vertical-align: middle; font-size: .9em; font-weight: 700; padding: .15em .9em; background: #2f55a4; color: #fff; }
  #name.hide { display: none; }
  #hint { display: inline-block; vertical-align: middle; margin-left: .5em; font-size: .72em; color: #2f55a4; background: rgba(255,255,255,.9); padding: .1em .4em; }
  #text {
    position: absolute; left: 1em; right: 1em; top: 1.2em; bottom: .7em;
    font-size: 1em; line-height: 1.6em;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #text.narr { color: #3f4a6b; }
  #nextMark { position: absolute; right: .9em; bottom: .4em; color: #f2a0b4; font-size: .8em; -webkit-animation: bob 1s infinite; animation: bob 1s infinite; }
  @-webkit-keyframes bob { 50% { -webkit-transform: translateY(.2em); } }
  @keyframes bob { 50% { transform: translateY(.2em); } }
  .term { border-bottom: 2px dotted #f2a0b4; color: #b0466a; cursor: pointer; }

  .chip { display: inline-block; margin: 0 .2em .5em 0; padding: .1em .5em; border: 1.5px solid #2b2b2b; border-radius: .35em; background: #fffdf6; box-shadow: 0 .15em 0 #2b2b2b; line-height: 1.5em; cursor: pointer; }
  .chip.used { opacity: .3; box-shadow: none; -webkit-transform: translateY(.15em); transform: translateY(.15em); }
  .punct { display: inline-block; margin-right: .2em; }
  .nw { white-space: nowrap; display: inline-block; }

  /* ---------- 日記本（選單） ---------- */
  #menu { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(60,60,90,.45); display: none; z-index: 5; }
  #menu.open { display: block; }
  .book {
    position: absolute; left: .8em; right: .8em; top: 3.4em; bottom: 1em;
    background-color: #fffdf8;
    background-image:
      linear-gradient(rgba(143,168,224,.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,168,224,.2) 1px, transparent 1px);
    background-size: 1em 1em;
    border-radius: .3em .8em .8em .3em;
    border-left: .5em solid #8fa8e0;
    box-shadow: .3em .4em 1em rgba(0,0,0,.2);
    padding: 1.2em 1em 1em 1.1em; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .tabs { position: absolute; left: 1.3em; right: .8em; top: 1.6em; white-space: nowrap; }
  .tab { display: inline-block; position: relative; font-size: .74em; padding: .45em .65em .75em; margin-left: -.45em; border-radius: .55em .55em 0 0; background: #e9e4d8; color: #666; cursor: pointer; box-shadow: -.12em 0 .25em rgba(0,0,0,.12); }
  .tab:first-child { margin-left: 0; }
  .tab.on { z-index: 2; }
  .tab.on { background: #fbe1e8; color: #6b3a48; font-weight: 700; }
  .tab:nth-child(2).on { background: #f6efc9; color: #6b5a1e; }
  .tab:nth-child(3).on { background: #dfe7fa; color: #2f55a4; }
  .tab:nth-child(4).on { background: #e6e2f4; color: #4b437a; }
  .tab:nth-child(5).on { background: #fff; color: #555; }
  #closeMenu { position: absolute; right: 1.5em; top: 3.9em; font-size: 1em; background: none; border: none; color: #999; z-index: 2; }
  .page h3 { margin: 0 0 .7em; font-weight: normal; padding-right: 1.6em; }
  .page h3 .big { font-size: 1.35em; font-weight: 700; background: linear-gradient(transparent 60%, rgba(242,181,196,.7) 60%); padding: 0 .2em; }
  .page h3 .small { font-size: .78em; color: #888; margin-left: .6em; }
  .page h3 .sub { display: block; font-size: .72em; color: #888; margin-top: .35em; }
  .page p, .page li { font-size: .85em; line-height: 1.7em; margin: .2em 0; }
  .stat { display: inline-block; margin: 0 .4em .5em 0; padding: .3em .7em; font-size: .8em; background: #fff; border: 1px solid #ddd8cc; }
  .week { width: 100%; border-collapse: collapse; margin-top: .4em; font-size: .8em; background: #fff; }
  .week td { border: 1px solid #ddd8cc; padding: .4em .3em; text-align: center; }
  .week td.day { width: 2.6em; color: #888; }
  .week tr.fixed td { background: #fdf6f8; }
  .act { display: inline-block; padding: .15em .6em; border-radius: 1em; font-size: .9em; }
  .act.club { background: #fbe1e8; } .act.job { background: #f6efc9; } .act.watch { background: #dfe7fa; } .act.home { background: #e6e2f4; }
  .act.free { background: #fff; border: 1.5px dashed #8fa8e0; color: #2f55a4; cursor: pointer; }
  .lock { font-size: .75em; color: #b0466a; margin-left: .3em; }
  .entry { background: #fff; border: 1px solid #ddd8cc; padding: .6em .8em; margin-bottom: .7em; position: relative; }
  .entry .ttl { font-weight: 700; }
  .entry .jp, .entry .when { font-size: .75em; color: #888; margin-left: .4em; font-weight: normal; }
  .entry .memo { font-size: .78em; color: #b0466a; margin-top: .3em; }
  .entry .ev { margin-top: .4em; }
  .entry .ev span { display: inline-block; font-size: .72em; padding: .05em .5em; margin-right: .3em; background: #f6efc9; }
  .entry.diary { background: #fffef4; -webkit-transform: rotate(-.4deg); transform: rotate(-.4deg); }
  .entry.diary:nth-child(odd) { -webkit-transform: rotate(.5deg); transform: rotate(.5deg); }
  .entry.diary .tape { left: 40%; top: -.5em; width: 3em; height: .9em; }
  .strike { text-decoration: line-through; color: #aaa; }
  .locked { color: #bbb; }
  .opt { display: inline-block; padding: .4em .9em; margin: 0 .4em .4em 0; font-size: .85em; border: 1.5px solid #2b2b2b; border-radius: .4em; background: #fff; cursor: pointer; }
  .opt.on { background: #2f55a4; color: #fff; border-color: #2f55a4; }

  /* ---------- 彈出便條 ---------- */
  #popup { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(60,60,90,.3); display: none; z-index: 9; }
  #popup.open { display: block; }
  .note {
    position: absolute; left: 50%; top: 45%; width: 82%; max-width: 21em;
    -webkit-transform: translate(-50%, -50%) rotate(-1deg); transform: translate(-50%, -50%) rotate(-1deg);
    background: #f6efc9; padding: 1.4em 1.1em 1em; box-shadow: .2em .3em .8em rgba(0,0,0,.2);
  }
  .note .tape { left: 40%; top: -.5em; width: 4em; }
  .note h4 { margin: 0 0 .5em; font-size: 1.15em; }
  .note p { margin: .3em 0; font-size: .88em; line-height: 1.7em; }
  .note .btns { text-align: right; margin-top: .7em; }
  .note button { font-size: .85em; padding: .4em .9em; border: none; border-radius: .4em; background: #2f55a4; color: #fff; margin-left: .4em; }
  .note button.sub { background: #fff; color: #2f55a4; border: 1.5px solid #2f55a4; }

  /* ---------- 橫屏 ---------- */
  #stage.landscape #scene { top: 1em; bottom: 1em; right: 52%; }
  #stage.landscape .polaroid { width: 12.5em; }
  #stage.landscape .polaroid .photo { height: 14.5em; }
  #stage.landscape #dialog { left: 49%; right: 1em; top: 6.4em; bottom: 2em; height: auto; }
  #stage.landscape #topbar { left: 49%; }
  #stage.landscape .book { left: 18%; right: 18%; top: 2.8em; }
  #stage.landscape .tabs { left: calc(18% + .5em); top: 1em; }
  #stage.landscape #closeMenu { right: calc(18% + .7em); top: 3.3em; }

  /* =========================================================
     孔版印刷風（F1 配色）
     藍 #3a5cb0（朝田）／粉 #f3a9bf（大面積）／杏黃 #f2b45e（新谷・點綴）／深粉 #e2568a（女主角的標注）
     ========================================================= */
  #stage { background-color: #f8f5f0; background-image: none; }
  #grain { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
    background: url("img/grain.png"); background-size: 9em 9em; mix-blend-mode: multiply; opacity: .55; }
  .riso { position: absolute; mix-blend-mode: multiply; pointer-events: none; }
  .riso.dots { background-image: radial-gradient(#f3a9bf 32%, transparent 34%); background-size: .5em .5em; }
  .riso.ging { opacity: .38;
    background-image: linear-gradient(90deg, #f3a9bf 50%, transparent 50%), linear-gradient(#c7d3f0 50%, transparent 50%);
    background-size: 1.5em 1.5em; }
  .riso.strip { background: #f2b45e; opacity: .75; }
  .drop { position: absolute; width: .5em; height: .72em; background: #3a5cb0; opacity: .7; mix-blend-mode: multiply;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }

  .tape.pink { background-color: rgba(243,169,191,.85); }
  .tape.blue { background-image: repeating-linear-gradient(45deg, #3a5cb0 0, #3a5cb0 .3em, #fff .3em, #fff .6em); opacity: .55; }

  #evidence { border: none; box-shadow: .2em .2em 0 #c7d3f0; }
  #evidence .label { background: #e2568a; color: #fff; mix-blend-mode: multiply; }
  .slot { border-color: #3a5cb0; color: #3a5cb0; }
  .slot.filled, .slot.filled:nth-child(2), .slot.filled:nth-child(3) { background: #fbd2de; box-shadow: none; }
  #submitBtn { background: #3a5cb0; }
  #submitBtn[disabled] { background: #b9c3e2; }
  #menuBtn { border: 1px solid #ddd8cc; box-shadow: .18em .18em 0 #c7d3f0; }

  .backpaper { position: absolute; left: 50%; top: 50%; width: 15em; height: 21.5em; background: #f3a9bf; opacity: .7; mix-blend-mode: multiply;
    -webkit-transform: translate(-46%, -52%) rotate(-6deg); transform: translate(-46%, -52%) rotate(-6deg);
    -webkit-transition: opacity .15s; transition: opacity .15s; }
  .backpaper.hide { opacity: 0; }
  .polaroid { box-shadow: .15em .2em 0 rgba(0,0,0,.08); }
  .polaroid .photo { background: #dde5f6; }
  .polaroid .photo:before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background-image: radial-gradient(#3a5cb0 30%, transparent 32%); background-size: .4em .4em; opacity: .22; }
  .polaroid .cap .d, #place .d { color: #e2568a; }
  .placeholder-note { color: #3a5cb0; }

  #dialog { border: none; box-shadow: .35em .35em 0 #3a5cb0;
    background-image: linear-gradient(transparent 1.55em, rgba(58,92,176,.12) 1.55em, rgba(58,92,176,.12) 1.62em, transparent 1.62em); }
  #dialog:after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
    border: 1.5px solid #e2568a; -webkit-transform: translate(-.18em, -.12em); transform: translate(-.18em, -.12em); }
  #dialog .tape, #namebar { z-index: 2; }
  #text, #nextMark { z-index: 2; }
  #name { background: #3a5cb0; }
  #hint { color: #3a5cb0; background: #fff; }
  #text.narr { color: #3a4a78; }
  #nextMark, .term { color: #e2568a; }
  .term { border-bottom-color: #e2568a; }
  .chip.used { opacity: 1; background: #fbd2de; border-color: #e2568a; color: #e2568a; box-shadow: none; }

  /* 日記本 */
  .book { border-left-color: #3a5cb0; background-color: #fffdfa;
    background-image: linear-gradient(rgba(58,92,176,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(58,92,176,.1) 1px, transparent 1px); }
  .page h3 .big { background: linear-gradient(transparent 60%, rgba(243,169,191,.85) 60%); }
  .tab.on { background: #fbd2de; color: #a33a63; }
  .tab:nth-child(2).on { background: #fbe6c4; color: #8a5a12; }
  .tab:nth-child(3).on { background: #dde5f6; color: #3a5cb0; }
  .tab:nth-child(4).on { background: #e6e2f4; color: #4b437a; }
  .act.club { background: #fbd2de; } .act.job { background: #fbe6c4; } .act.watch { background: #dde5f6; }
  .act.free { border-color: #3a5cb0; color: #3a5cb0; }
  .lock, .entry .memo { color: #c2416f; }
  .entry .ev span { background: #fbd2de; }
  .opt.on { background: #3a5cb0; border-color: #3a5cb0; }

  /* 直屏：索引標籤改到右側，直排 */
  #stage.portrait .book { top: 1.2em; right: 2.7em; }
  #stage.portrait .tabs { left: auto; right: .55em; top: 3em; width: 2.3em; white-space: normal; }
  #stage.portrait .tab { display: block; margin: -.5em 0 0 0; padding: .8em .5em .8em .75em; font-size: .8em; background: #f1ece2;
    -webkit-writing-mode: vertical-rl; writing-mode: vertical-rl; letter-spacing: .12em;
    border-radius: 0 .55em .55em 0; box-shadow: .12em .1em .25em rgba(0,0,0,.12); }
  #stage.portrait .tab:first-child { margin-top: 0; }
  #stage.portrait #closeMenu { right: 3.3em; top: 1.6em; }

  #stage.landscape .backpaper { width: 13em; height: 19em; }
  #stage.landscape .riso.dots { right: auto; left: 15.5em; top: .5em; width: 8em; height: 9em; }
  #stage.landscape .riso.strip { right: auto; left: 2em; bottom: 1.2em; }

  /* 紙膠帶改成不透明 */
  .tape { opacity: 1; }
  .tape.pink { background-color: #f6c0d0; }
  .tape.blue { opacity: 1; background-image: repeating-linear-gradient(45deg, #8ea3d8 0, #8ea3d8 .3em, #fff .3em, #fff .6em); }

  /* 日記本：右側多頁紙重疊 */
  .book { box-shadow:
      .2em .1em 0 #f6f2eb, .26em .14em 0 #d8d1c4,
      .46em .24em 0 #f2ede4, .52em .28em 0 #d8d1c4,
      .72em .38em 0 #eee9df, .78em .42em 0 #cfc7b8,
      .9em .8em 1em rgba(0,0,0,.18); }
  .tabs { z-index: 1; }
  #stage.portrait .book { right: 3.3em; }
  #stage.portrait #closeMenu { right: 3.55em; top: 1.45em; }
  #stage.landscape #closeMenu { right: calc(18% + .35em); }
  .tab:nth-child(5).on { background: #fbe6c4; color: #8a5a12; }
  .tab:nth-child(6).on { background: #fff; color: #555; }

  /* 存檔：記分簿 */
  .sb { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: .8em; border: 1.5px solid #3a5cb0; }
  .sb td { border: 1px solid #c7d3f0; padding: .45em .5em; font-size: .8em; vertical-align: middle; }
  .sb td.no { width: 2em; text-align: center; color: #3a5cb0; font-weight: 700; background: #eef2fb; }
  .sb td.dia { width: 4.2em; text-align: center; }
  .sb td.dia svg { width: 3.4em; height: 3.4em; display: block; margin: 0 auto; }
  .sb .k { color: #888; font-size: .85em; margin-right: .3em; }
  .sb .inn { color: #e2568a; font-weight: 700; }
  .sb .empty { color: #bbb; }
  .sbtn { display: inline-block; font-size: .8em; padding: .3em .8em; margin: .3em .3em 0 0; border-radius: .4em; border: 1.5px solid #3a5cb0; color: #3a5cb0; background: #fff; cursor: pointer; }
  .sbtn.main { background: #3a5cb0; color: #fff; }
  /* 悠哉只有一種粗細，避免瀏覽器硬加粗 */
  #evidence .label, #name, .tab.on, .page h3 .big, .entry .ttl, .note h4, .note b, .polaroid .cap { font-weight: 500; }

  /* ---------- 標籤：未選中也有各自的顏色 ---------- */
  .tab, #stage.portrait .tab { color: #7a7268; }
  .tab:nth-child(1), #stage.portrait .tab:nth-child(1) { background: #fde6ed; }
  .tab:nth-child(2), #stage.portrait .tab:nth-child(2) { background: #fdf0dc; }
  .tab:nth-child(3), #stage.portrait .tab:nth-child(3) { background: #ebf0fa; }
  .tab:nth-child(4), #stage.portrait .tab:nth-child(4) { background: #efedf8; }
  .tab:nth-child(5), #stage.portrait .tab:nth-child(5) { background: #fbe4d9; }
  .tab:nth-child(6), #stage.portrait .tab:nth-child(6) { background: #f1eee8; }
  .tab:nth-child(1).on { background: #f8bfd0; color: #9c2f5a; }
  .tab:nth-child(2).on { background: #f9d9a8; color: #8a5a12; }
  .tab:nth-child(3).on { background: #c9d6f2; color: #2f4f9e; }
  .tab:nth-child(4).on { background: #d8d2f0; color: #4b437a; }
  .tab:nth-child(5).on { background: #f6c7b3; color: #8f4628; }
  .tab:nth-child(6).on { background: #ffffff; color: #555; }
  #stage.portrait .tab.on { -webkit-transform: translateX(.3em); transform: translateX(.3em); }
  #stage.landscape .tab.on { -webkit-transform: translateY(-.2em); transform: translateY(-.2em); }

  /* ---------- 日記本翻頁 ---------- */
  .book { -webkit-perspective: 60em; perspective: 60em; }
  .page { -webkit-transform-origin: 0 50%; transform-origin: 0 50%; }
  .page.turn { -webkit-animation: pageturn .45s ease-out; animation: pageturn .45s ease-out; }
  @-webkit-keyframes pageturn { 0% { -webkit-transform: rotateY(70deg); opacity: .2; } 100% { -webkit-transform: rotateY(0); opacity: 1; } }
  @keyframes pageturn { 0% { transform: rotateY(70deg); opacity: .2; } 100% { transform: rotateY(0); opacity: 1; } }

  /* ---------- 扉頁（開場） ---------- */
  #prologue { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; display: none;
    background: #c9d3ee; -webkit-perspective: 80em; perspective: 80em; }
  #prologue.show { display: block; }
  .leaf { position: absolute; left: 1.4em; right: 1.4em; top: 1.4em; bottom: 1.4em;
    background-color: #fffdf8; border-left: .5em solid #3a5cb0; border-radius: .3em .8em .8em .3em;
    background-image: linear-gradient(rgba(58,92,176,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(58,92,176,.08) 1px, transparent 1px);
    background-size: 1em 1em;
    box-shadow: .2em .1em 0 #f6f2eb, .26em .14em 0 #d8d1c4, .46em .24em 0 #f2ede4, .52em .28em 0 #d8d1c4, .9em .8em 1em rgba(0,0,0,.18);
    -webkit-transform-origin: 0 50%; transform-origin: 0 50%; }
  .leaf.away { -webkit-transition: -webkit-transform .7s ease-in, opacity .7s ease-in; transition: transform .7s ease-in, opacity .7s ease-in;
    -webkit-transform: rotateY(-100deg); transform: rotateY(-100deg); opacity: 0; }
  .waka { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; }
  .vt { -webkit-writing-mode: vertical-rl; writing-mode: vertical-rl; height: 82%; }
  .vt p { margin: 0 0 0 .6em; }
  .vt .jp { font-size: 1.25em; letter-spacing: .18em; color: #2a2a3a; }
  .vt .zh { font-family: "Maple Thin", "PingFang TC", sans-serif; font-size: .95em; letter-spacing: .08em; color: #3a4a78; }
  .vt .gap { margin-left: 2.2em; }
  .vt .src { font-size: .7em; color: #888; letter-spacing: .05em; -webkit-align-self: flex-end; align-self: flex-end; }
  .vt .src { margin-top: auto; }
  .leaf .drop1 { position: absolute; right: 2.2em; top: 2.4em; }
  .tapnext { position: absolute; left: 0; right: 0; bottom: 2.6em; text-align: center; font-size: .75em; color: #e2568a;
    -webkit-animation: bob 1.2s infinite; animation: bob 1.2s infinite; }
  #stage.landscape .leaf { left: 18%; right: 18%; top: .8em; bottom: .8em; }
  #stage.landscape .vt { height: 90%; }
  #stage.landscape .vt .jp { font-size: .92em; letter-spacing: .04em; }
  #stage.landscape .vt .zh { font-size: .68em; letter-spacing: 0; }
  #stage.landscape .vt .src { font-size: .5em; }
  #stage.landscape .tapnext { bottom: .6em; left: auto; right: 1.2em; }

  /* ---------- 扉頁：明朝體、右上角的緊湊區塊 ---------- */
  @font-face { font-family: "ZenOldWaka"; src: url("fonts/zen-old-mincho-waka.woff2") format("woff2"); }
  @font-face { font-family: "GenYoWaka"; src: url("fonts/genyomin-waka.woff2") format("woff2"); }
  .waka { display: block; }
  .vt { position: absolute; right: 2.4em; top: 3.2em; height: auto; font-size: .72em; line-height: 1.85; color: #85858f; }
  .vt p, .vt .jp, .vt .zh, .vt .src { margin: 0; font-size: 1em; color: #85858f; letter-spacing: .1em; }
  .vt .jp { font-family: "ZenOldWaka", "GenYoWaka", serif; }
  .vt .zh, .vt .src { font-family: "GenYoWaka", "ZenOldWaka", serif; }
  .vt .gap { margin-left: 0; margin-right: 1.3em; }
  .vt .src { -webkit-align-self: auto; align-self: auto; }
  .leaf .drop1 { right: .9em; top: 1.1em; }
  #stage.landscape .vt { font-size: .58em; top: 2.6em; right: 2.2em; height: auto; }
  #stage.landscape .vt .jp, #stage.landscape .vt .zh, #stage.landscape .vt .src { font-size: 1em; letter-spacing: .05em; }

  /* ---------- 雨滴：上尖下圓 ---------- */
  .drop { border-radius: 0; opacity: .75; background: transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 30'><path d='M10 0 C10 0 19 13 19 20 A9 9 0 0 1 1 20 C1 13 10 0 10 0Z' fill='%233a5cb0'/></svg>") no-repeat center / contain; }
  .note { background: #fde9cc; }
  .note button { background: #3a5cb0; }
  .note button.sub { color: #3a5cb0; border-color: #3a5cb0; background: #fff; }
</style>
</head>
<body>
<div id="stage">

  <div id="grain"></div>
  <div class="riso dots" style="right:-1.5em; top:4.5em; width:10.5em; height:11.5em;"></div>
  <div class="riso ging" style="left:-2.5em; bottom:12.5em; width:9.5em; height:7.5em; -webkit-transform:rotate(-10deg); transform:rotate(-10deg);"></div>
  <div class="riso strip" style="right:-.5em; bottom:12.6em; width:5.5em; height:1.2em; -webkit-transform:rotate(5deg); transform:rotate(5deg);"></div>
  <svg class="doodle riso" style="left:.9em; top:8.6em; width:1.6em;" viewBox="0 0 40 40"><path d="M20 3 L24 15 L37 15 L26 23 L30 36 L20 28 L10 36 L14 23 L3 15 L16 15 Z" fill="#f2b45e"/></svg>
  <svg class="doodle riso" style="left:.7em; top:16.5em; width:3.4em;" viewBox="0 0 60 30"><path d="M5 20 C15 2, 25 30, 35 12 S 55 8, 55 22" fill="none" stroke="#e2568a" stroke-width="2.4" stroke-linecap="round"/></svg>
  <svg class="doodle riso" style="right:2.6em; top:6.2em; width:2.6em; -webkit-transform:rotate(-12deg); transform:rotate(-12deg);" viewBox="0 0 60 30"><path d="M5 20 C15 2, 25 30, 35 12 S 55 8, 55 22" fill="none" stroke="#3a5cb0" stroke-width="2" stroke-linecap="round"/></svg>
  <span class="drop" style="left:1.4em; top:6.4em;"></span>
  <span class="drop" style="right:1.2em; top:18em;"></span>

  <div id="topbar">
    <div id="evidence">
      <span class="label">考察欄</span>
      <div class="slots">
        <span class="slot" data-i="0">？</span><span class="slot" data-i="1">？</span><span class="slot" data-i="2">？</span><button id="submitBtn" disabled>提出</button>
      </div>
    </div>
    <button id="menuBtn" aria-label="日記本">
      <svg viewBox="0 0 30 30"><path d="M4 8 C10 7, 20 9, 26 7.5" stroke="#3a5cb0" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M4 15.5 C11 14.5, 19 16.5, 26 15" stroke="#e2568a" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M4 23 C10 22, 21 24, 26 22.5" stroke="#3a5cb0" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="scene">
    <div id="place"></div>
    <div class="backpaper hide" id="backpaper"></div>
    <div class="polaroid hide" id="portrait">
      <span class="tape pink"></span>
      <div class="photo">
        <div class="placeholder-note">立繪預定地</div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet"><circle cx="50" cy="38" r="17" fill="#fff" stroke="#3a5cb0" stroke-width="2"/><path d="M18 100 C18 72, 32 60, 50 60 C68 60, 82 72, 82 100 Z" fill="#fff" stroke="#3a5cb0" stroke-width="2"/></svg>
      </div>
      <div class="cap" id="cap"></div>
    </div>
  </div>

  <div id="dialog">
    <span class="tape blue l"></span><span class="tape pink r"></span>
    <div id="namebar"><span id="name" class="hide"></span><span id="hint" style="display:none">▶ 從台詞中選出三個關鍵詞</span></div>
    <div id="text"></div>
    <div id="nextMark">▼</div>
  </div>

  <div id="menu">
    <div class="tabs">
      <span class="tab on" data-p="sched">日程管理</span><span class="tab" data-p="diary">原主日記</span><span class="tab" data-p="dict">用語筆記</span><span class="tab" data-p="log">考察紀錄</span><span class="tab" data-p="save">存檔</span><span class="tab" data-p="set">設定</span>
    </div>
    <button id="closeMenu">✕</button>
    <div class="book" id="book"></div>
  </div>

  <div id="popup"><div class="note" id="note"></div></div>
  <div id="prologue">
    <div class="leaf" id="leaf">
      <span class="drop drop1"></span>
      <div class="waka">
        <div class="vt">
          <p class="jp">春雨に　衣はいたく　通らめや</p>
          <p class="jp">七日し降らば　七日来じとや</p>
          <p class="zh gap">一點春雨　難道就會把衣服淋得濕透嗎</p>
          <p class="zh">若是這雨連下七天　難道您就七天不來了？</p>
          <p class="src gap">——『万葉集』巻第十・春相聞・寄雨・一九一七番（佚名）</p>
        </div>
      </div>
      <div class="tapnext">輕觸翻頁</div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   劇本資料
   who：說話的人（空白＝旁白，「我」＝女主角）
   text：台詞，[[詞]] 代表用語筆記的詞彙
   tokens：考察用台詞，key:true 為正確關鍵詞
   record：到達這一行時寫進考察紀錄
   ========================================================= */
var DATE = "4月3日";
var SCRIPT = [
  { who: "", place: "教室", text: "（放學後。窗外傳來棒球部練習的聲音。）" },
  { who: "千夏", text: "什麼？你說 A 前輩和 B 同學？不可能啦。" },
  { who: "千夏", text: "上次我還看到他們兩個在[[牛棚]]吵架欸。" },
  { who: "我", text: "（……吵架？那就找出證據給她看。）" },
  { who: "", place: "走廊", text: "（A 前輩正在跟 B 同學說話。）" },
  { who: "A", evidence: true, tokens: [
      { t: "你" }, { t: "昨天" }, { t: "又", key: true }, { t: "忘記" }, { t: "帶傘了吧" }, { p: "，" },
      { t: "我的", key: true }, { t: "借你" }, { p: "，" }, { t: "明天還", key: true }, { t: "就好" }, { p: "。" }
  ] },
  { who: "我", place: "教室", text: "千夏，你聽好。A 前輩說的是「又」忘記帶傘，代表 B 同學忘記帶傘的事已經發生過好幾次了。" },
  { who: "我", text: "而且借出去的是「我的」傘，還說「明天還」就好——這等於替明天見面找好理由了吧！" },
  { who: "我", text: "B 同學八成從來不看天氣預報，A 前輩每次都乖乖借傘給他。這是溺愛！溺愛啦！" },
  { who: "千夏", text: "……等一下，「又」？他常常這樣嗎？" },
  { who: "", text: "（千夏動搖了！）", record: {
      title: "借傘事件", when: "第 1 週", keys: ["又", "我的", "明天還"],
      body: "B 同學經常忘記看天氣預報，所以 A 前輩總是借他雨傘。"
  } },
  { who: "", text: "（試玩到這裡結束。）", end: true }
];

var DICT = {
  "牛棚": { jp: "ブルペン", body: "投手在比賽前或比賽中練習投球的區域，捕手會在這裡接球。", memo: "原主的筆記：A 前輩常常在這裡留到最後。" },
  "女房役": { jp: "にょうぼうやく", body: "捕手的別稱。捕手負責引導投手、配球、照顧投手的狀態，所以被比喻為「妻子」。", memo: "原主的筆記：意思是……？" },
  "夏甲": { jp: "夏の甲子園", body: "全國高等學校棒球選手權大會，每年八月在甲子園球場舉行。", memo: "" }
};

/* 原主日記：穿越前就寫好的內容 */
var DIARY = [
  { date: "3/28", body: "春假最後一週。明天開始要整理新學期的筆記本。" },
  { date: "4/1", body: "新學期。同班的 B 同學和棒球部的 A 前輩好像是舊識，午休的時候 A 前輩特地跑來教室找他。" },
  { date: "4/2", body: "<span class='strike'>A×B……？</span>不行，這種事不能寫在這裡。" }
];

/* ========================================================= */
var state = { i: 0, slots: [null, null, null], unlocked: {}, log: [], orient: "auto", money: 5000, grade: "C", tab: "sched", onClose: null };
var $ = function (id) { return document.getElementById(id); };

function renderLine() {
  autoSave();
  var line = SCRIPT[state.i];
  if (line.place) state.place = line.place;
  var nameEl = $("name"), textEl = $("text");
  var dateHtml = '<span class="d">' + DATE + '</span>' + (state.place || "");
  var showPortrait = line.who && line.who !== "我";

  if (line.who) { nameEl.innerHTML = line.who; nameEl.className = ""; } else { nameEl.className = "hide"; }
  $("portrait").className = showPortrait ? "polaroid" : "polaroid hide";
  $("backpaper").className = showPortrait ? "backpaper" : "backpaper hide";
  $("cap").innerHTML = dateHtml;
  $("place").innerHTML = dateHtml;
  $("place").style.display = showPortrait ? "none" : "block";

  $("hint").style.display = line.evidence ? "inline-block" : "none";
  $("nextMark").style.display = line.evidence ? "none" : "block";
  textEl.className = line.who ? "" : "narr";
  textEl.scrollTop = 0;

  if (line.evidence) {
    var html = "";
    for (var k = 0; k < line.tokens.length; k++) {
      var tk = line.tokens[k];
      if (tk.p) continue;
      var nx = line.tokens[k + 1];
      var after = (nx && nx.p) ? '<span class="punct">' + nx.p + '</span>' : '';
      html += '<span class="nw"><span class="chip" data-k="' + k + '">' + tk.t + '</span>' + after + '</span>';
    }
    textEl.innerHTML = html;
  } else {
    textEl.innerHTML = line.text.replace(/\[\[(.+?)\]\]/g, '<span class="term" data-term="$1">$1</span>');
  }
  refreshChips();

  if (line.record) {
    var r = line.record, exists = false;
    for (var q = 0; q < state.log.length; q++) if (state.log[q].title === r.title) exists = true;
    if (!exists) {
      state.log.push(r);
      showNote("✎ 考察紀錄已更新", "<p><b>" + r.title + "</b></p><p>" + r.body + "</p>", '<button onclick="closePopup()">好</button>');
    }
  }
  if (line.end) {
    showNote("試玩結束", "<p>考察紀錄可以在右上角的日記本裡查看。</p>",
      '<button class="sub" onclick="openMenu(\'log\')">看考察紀錄</button><button onclick="restart()">從頭再玩</button>');
  }
}

function refreshChips() {
  var line = SCRIPT[state.i];
  var chips = document.querySelectorAll(".chip");
  for (var c = 0; c < chips.length; c++) {
    var k = +chips[c].getAttribute("data-k");
    chips[c].className = state.slots.indexOf(k) >= 0 ? "chip used" : "chip";
  }
  var slotEls = document.querySelectorAll(".slot"), full = true;
  for (var s = 0; s < 3; s++) {
    var v = state.slots[s];
    if (v === null || !line.tokens) { slotEls[s].innerHTML = "？"; slotEls[s].className = "slot"; full = false; }
    else { slotEls[s].innerHTML = line.tokens[v].t; slotEls[s].className = "slot filled"; }
  }
  $("submitBtn").disabled = !full || !line.evidence;
}

function next() {
  var line = SCRIPT[state.i];
  if (line.evidence || line.end) return;
  if (state.i < SCRIPT.length - 1) { state.i++; renderLine(); }
}

function submit() {
  var line = SCRIPT[state.i], hit = 0, words = [];
  for (var s = 0; s < 3; s++) { var tk = line.tokens[state.slots[s]]; words.push(tk.t); if (tk.key) hit++; }
  var combo = "<p>「" + words.join("」＋「") + "」</p>";
  if (hit === 3) {
    showNote("考察成立！", combo + "<p>→ 他已經習慣照顧對方，還替兩人留了下一次見面的理由。</p>", '<button onclick="closePopup()">去找千夏！</button>');
    state.onClose = function () { state.slots = [null, null, null]; state.i++; renderLine(); };
  } else if (hit === 0) {
    showNote("考察……成立？", combo + "<p>→ 結論：B 同學是個健忘的人。</p><p><b>千夏</b>：「你是在說 B 同學的壞話嗎？」</p>", '<button onclick="retry()">再考察一次</button>');
  } else {
    showNote("證據不足", combo + "<p><b>千夏</b>：「借傘而已吧？我也會借別人傘啊。」</p><p style='color:#888'>（正確的關鍵詞：" + hit + " / 3）</p>", '<button onclick="retry()">再考察一次</button>');
  }
}

function retry() { state.slots = [null, null, null]; closePopup(); refreshChips(); }
function restart() { state.slots = [null, null, null]; state.i = 0; state.place = ""; state.prologueSeen = false; closePopup(); $("menu").className = ""; renderLine(); showPrologue(); }

function showNote(title, body, btns) {
  $("note").innerHTML = '<span class="tape lav"></span><h4>' + title + '</h4>' + body + '<div class="btns">' + btns + '</div>';
  $("popup").className = "open";
}
function closePopup() {
  $("popup").className = "";
  var f = state.onClose; state.onClose = null;
  if (f) f();
}

function showTerm(term) {
  var d = DICT[term]; if (!d) return;
  var isNew = !state.unlocked[term];
  state.unlocked[term] = true;
  showNote(term + '<span style="font-size:.7em;color:#888;margin-left:.4em;font-weight:normal">' + d.jp + '</span>',
    '<p>' + d.body + '</p>' + (d.memo ? '<p style="color:#b0466a;font-size:.8em">' + d.memo + '</p>' : '') +
    (isNew ? '<p style="font-size:.75em;color:#2f55a4">✎ 已記錄到用語筆記</p>' : ''),
    '<button onclick="closePopup()">知道了</button>');
}

/* ---------- 日記本 ---------- */
function openMenu(tab) { if (tab) state.tab = tab; closePopup(); renderBook(); $("menu").className = "open"; }

function renderBook() {
  var html = '<div class="page">', t = state.tab, i;
  if (t === "sched") {
    var rows = [
      ["一", "club", "管弦樂部", true], ["二", "club", "管弦樂部", true], ["三", "free", "＋ 安排行程", false],
      ["四", "club", "管弦樂部", true], ["五", "club", "管弦樂部", true], ["六", "club", "管弦樂部（半天）", true], ["日", "free", "＋ 安排行程", false]
    ];
    html += '<h3><span class="big">第 1 週</span><span class="small">4/1 – 4/7</span></h3>';
    html += '<span class="stat">零用錢 ¥' + state.money + '</span><span class="stat">成績 ' + state.grade + '</span>';
    html += '<p style="color:#888">上課態度：<span class="act watch">認真聽課</span></p>';
    html += '<table class="week">';
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<tr' + (r[3] ? ' class="fixed"' : '') + '><td class="day">' + r[0] + '</td><td><span class="act ' + r[1] + '">' + r[2] + '</span>' + (r[3] ? '<span class="lock">固定</span>' : '') + '</td></tr>';
    }
    html += '</table><p style="color:#aaa;font-size:.75em">社團活動每週固定，休部日（週三、週日）可以自由安排打工、圍觀練習或回家。（示意畫面）</p>';
  } else if (t === "diary") {
    html += '<h3><span class="big">原主日記</span><span class="sub">穿越前寫下的內容</span></h3>';
    for (i = 0; i < DIARY.length; i++) html += '<div class="entry diary"><span class="tape pink"></span><div class="ttl">' + DIARY[i].date + '</div><p>' + DIARY[i].body + '</p></div>';
  } else if (t === "dict") {
    html += '<h3><span class="big">用語筆記</span><span class="sub">棒球相關的用語</span></h3>';
    for (var k in DICT) {
      if (state.unlocked[k]) html += '<div class="entry"><span class="ttl">' + k + '</span><span class="jp">' + DICT[k].jp + '</span><p>' + DICT[k].body + '</p>' + (DICT[k].memo ? '<div class="memo">' + DICT[k].memo + '</div>' : '') + '</div>';
      else html += '<div class="entry locked">？？？　<span style="font-size:.75em">（尚未記錄）</span></div>';
    }
  } else if (t === "log") {
    html += '<h3><span class="big">考察紀錄</span><span class="sub">由關鍵詞推導出的事件</span></h3>';
    if (!state.log.length) html += '<p style="color:#aaa">還沒有任何紀錄。</p>';
    for (i = 0; i < state.log.length; i++) {
      var L = state.log[i], ev = "";
      for (var e = 0; e < L.keys.length; e++) ev += '<span>' + L.keys[e] + '</span>';
      html += '<div class="entry"><span class="ttl">' + L.title + '</span><span class="when">' + L.when + '</span><p>' + L.body + '</p><div class="ev">' + ev + '</div></div>';
    }
  } else if (t === "save") {
    html += '<h3><span class="big">存檔</span><span class="sub">記分簿</span></h3>';
    for (i = 0; i < 3; i++) {
      var d = loadSlot(i);
      html += '<table class="sb"><tr><td class="no" rowspan="3">' + (i + 1) + '</td><td class="dia" rowspan="3">' + diamond(d ? d.month : 0) + '</td>';
      if (d) {
        html += '<td><span class="k">日期</span>' + d.date + '</td></tr><tr><td><span class="k">地點</span>' + d.place + '</td></tr><tr><td><span class="k">回</span><span class="inn">' + d.inning + '回</span></td></tr>';
      } else {
        html += '<td class="empty">—</td></tr><tr><td class="empty">—</td></tr><tr><td class="empty">—</td></tr>';
      }
      html += '</table><div style="margin:-.5em 0 .9em"><span class="sbtn main" data-save="' + i + '">記錄</span>' + (d ? '<span class="sbtn" data-load="' + i + '">讀取</span>' : '') + '</div>';
    }
  } else {
    var o = [["auto", "自動"], ["portrait", "直屏"], ["landscape", "橫屏"]];
    html += '<h3><span class="big">設定</span></h3><p>畫面方向</p>';
    for (i = 0; i < o.length; i++) html += '<span class="opt' + (state.orient === o[i][0] ? ' on' : '') + '" data-o="' + o[i][0] + '">' + o[i][1] + '</span>';
    html += '<p style="margin-top:1.2em">進度</p><p style="color:#888;font-size:.75em">遊戲會自動記錄進度，關掉網頁後再打開，會從上次的地方繼續。</p><span class="opt" data-reset="1">從頭開始</span>';
  }
  $("book").innerHTML = html + '</div>';
  $("book").scrollTop = 0;
  var tabs = document.querySelectorAll(".tab");
  for (i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].getAttribute("data-p") === t ? "tab on" : "tab";
}


/* ---------- 扉頁 ---------- */
function showPrologue() {
  var leaf = $("leaf"); leaf.className = "leaf";
  $("prologue").className = "show";
}
$("prologue").addEventListener("click", function (e) {
  e.stopPropagation();
  var leaf = $("leaf");
  if (leaf.className.indexOf("away") >= 0) return;
  leaf.className = "leaf away";
  setTimeout(function () { $("prologue").className = ""; state.prologueSeen = true; autoSave(); }, 700);
});

/* ---------- 自動存檔 ---------- */
var AUTO_KEY = "blg-autosave";
function autoSave() {
  var d = { i: state.i, place: state.place || "", unlocked: state.unlocked, log: state.log, orient: state.orient, prologueSeen: !!state.prologueSeen };
  try { window.localStorage.setItem(AUTO_KEY, JSON.stringify(d)); } catch (e) {}
}
function autoLoad() {
  try {
    var v = window.localStorage.getItem(AUTO_KEY); if (!v) return;
    var d = JSON.parse(v);
    if (typeof d.i === "number" && d.i < SCRIPT.length) state.i = d.i;
    state.place = d.place || ""; state.unlocked = d.unlocked || {}; state.log = d.log || []; state.orient = d.orient || "auto"; state.prologueSeen = !!d.prologueSeen;
    /* 停在考察或結束畫面以外的地方時，退回該段落的開頭比較自然：這裡先直接回到同一行 */
  } catch (e) {}
}

/* ---------- 存檔（記分簿） ---------- */
var INNING = 7; /* 一週目＝7回 */
function slotKey(n) { return "blg-save-" + n; }
function loadSlot(n) {
  try { var v = window.localStorage.getItem(slotKey(n)); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function saveSlot(n) {
  var d = { i: state.i, place: state.place || "", date: DATE, month: 4, inning: INNING, unlocked: state.unlocked, log: state.log };
  try { window.localStorage.setItem(slotKey(n), JSON.stringify(d)); } catch (e) {}
}
function loadGame(n) {
  var d = loadSlot(n); if (!d) return;
  state.i = d.i; state.place = d.place; state.unlocked = d.unlocked || {}; state.log = d.log || []; state.slots = [null, null, null];
  $("menu").className = ""; renderLine();
}
/* 壘包：4月＝一壘、5月＝二壘、6月＝三壘、7月以後＝回到本壘 */
function diamond(month) {
  var step = month ? Math.min(Math.max(month - 3, 0), 4) : 0;
  var pts = [[20, 36], [36, 20], [20, 4], [4, 20], [20, 36]];
  var path = "";
  for (var k = 1; k <= step; k++) path += '<line x1="' + pts[k - 1][0] + '" y1="' + pts[k - 1][1] + '" x2="' + pts[k][0] + '" y2="' + pts[k][1] + '" stroke="#e2568a" stroke-width="3" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 40 40"><path d="M20 36 L36 20 L20 4 L4 20 Z" fill="none" stroke="#c7d3f0" stroke-width="1.5"/>' + path + '</svg>';
}

/* ---------- 版面：直屏／橫屏 ---------- */
function layout() {
  var W = window.innerWidth, H = window.innerHeight;
  var mode = state.orient === "auto" ? (W > H ? "landscape" : "portrait") : state.orient;
  var ratio = mode === "portrait" ? 9 / 16 : 16 / 9;
  var w = W, h = W / ratio;
  if (h > H) { h = H; w = H * ratio; }
  var st = $("stage");
  st.style.width = w + "px"; st.style.height = h + "px";
  st.style.fontSize = (mode === "portrait" ? w / 21 : h / 21) + "px";
  st.className = mode;
}

/* ---------- 事件 ---------- */
/* 點擊畫面任何地方都能推進對話（上方列、日記本、彈出便條除外） */
document.body.addEventListener("click", function (e) {
  var el = e.target;
  if (el.closest && el.closest("#topbar, #menu, #popup, #prologue")) return;
  if (el.className === "term") { showTerm(el.getAttribute("data-term")); return; }
  if (el.className === "chip") {
    var k = +el.getAttribute("data-k"), empty = state.slots.indexOf(null);
    if (empty >= 0) { state.slots[empty] = k; refreshChips(); }
    return;
  }
  if (el.className === "chip used" || el.className === "nw" || el.className === "punct") return;
  next();
});
var slotEls = document.querySelectorAll(".slot");
for (var s = 0; s < slotEls.length; s++) {
  slotEls[s].addEventListener("click", function () {
    if (SCRIPT[state.i].evidence) { state.slots[+this.getAttribute("data-i")] = null; refreshChips(); }
  });
}
$("submitBtn").addEventListener("click", submit);
$("menuBtn").addEventListener("click", function () { openMenu(); });
$("closeMenu").addEventListener("click", function () { $("menu").className = ""; });
$("menu").addEventListener("click", function (e) {
  var el = e.target;
  if (el === this) { this.className = ""; return; }
  if (el.getAttribute("data-p") && el.getAttribute("data-p") !== state.tab) { state.tab = el.getAttribute("data-p"); renderBook(); var pg = document.querySelector("#book .page"); if (pg) pg.className = "page turn"; }
  if (el.getAttribute("data-o")) { state.orient = el.getAttribute("data-o"); layout(); renderBook(); autoSave(); }
  if (el.getAttribute("data-reset")) { state.unlocked = {}; state.log = []; restart(); }
  if (el.getAttribute("data-save")) { saveSlot(+el.getAttribute("data-save")); renderBook(); }
  if (el.getAttribute("data-load")) { loadGame(+el.getAttribute("data-load")); }
});
$("popup").addEventListener("click", function (e) { if (e.target === this) closePopup(); });
window.addEventListener("resize", layout);

autoLoad();
layout();
renderLine();
if (!state.prologueSeen) showPrologue();
</script>
</body>
</html>
